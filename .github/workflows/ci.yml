name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: |
          python -m unittest discover -s tests -v
          python .agents/skills/contribute-wikisource-fr/scripts/test_correct_wikisource_typography.py
          python .agents/skills/utiliser-api-wikisource/scripts/test_cdp_wikisource.py
      - name: Validate Agent Skills
        run: |
          python scripts/quick_validate.py .agents/skills/contribute-wikisource-fr
          python scripts/quick_validate.py .agents/skills/utiliser-api-wikisource
      - name: Repository checks
        run: python scripts/repo_check.py
